<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/springsecurity6"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="fragments/base">

<head>
    <th:block layout:fragment="css">
        <link rel="stylesheet" th:href="@{/css/index.css}">
    </th:block>
</head>

<body>

<div layout:fragment="content">
    <section class="hero">
        <div class="hero-inner">
            <h1>
                건강한 일상을 위한
                <span>스마트한 관리</span>
            </h1>
            <p>
                Guily와 함께 식단과 운동을 체계적으로 관리하고,<br>
                더 건강한 라이프스타일을 만들어보세요.
            </p>

            <div class="hero-buttons">
                <a sec:authorize="isAnonymous()" th:href="@{/login}" class="btn primary">
                    시작하기
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="5" y1="12" x2="19" y2="12"></line>
                        <polyline points="12 5 19 12 12 19"></polyline>
                    </svg>
                </a>

                <a sec:authorize="isAuthenticated()" th:href="@{/diet}" class="btn primary">
                    시작하기
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="5" y1="12" x2="19" y2="12"></line>
                        <polyline points="12 5 19 12 12 19"></polyline>
                    </svg>
                </a>

                <a th:href="@{/#}" class="btn outline">더 알아보기</a>
            </div>
        </div>
    </section>

    <section class="features">
        <div class="features-inner">
            <!-- 식단 관리 -->
            <div class="card">
                <a th:href="@{/diet-entry}">
                    <div class="icon-box orange">🍴</div>
                    <h3>식단 관리</h3>
                    <p>매일의 식사를 기록하고 영양소를 분석하여 건강한 식습관을 만들어보세요.</p>
                </a>
            </div>

            <!-- 운동 관리 -->
            <div class="card">
                <a th:href="@{/#}">
                    <div class="icon-box blue">💪</div>
                    <h3>운동 관리</h3>
                    <p>운동 계획을 세우고 실천 내역을 기록하여 목표를 달성하세요.</p>
                </a>
            </div>

            <!-- 진행 상황 추적 -->
            <div class="card">
                <a th:href="@{/#}">
                    <div class="icon-box purple">📈</div>
                    <h3>진행 상황 추적</h3>
                    <p>시각화된 리포트로 나의 건강 데이터를 한눈에 확인할 수 있습니다.</p>
                </a>
            </div>

            <!-- 커뮤니티 -->
            <div class="card">
                <a th:href="@{/board}">
                    <div class="icon-box green">💬</div>
                    <h3>커뮤니티</h3>
                    <p>같은 목표를 가진 사람들과 정보를 공유하고 함께 성장하세요.</p>
                </a>
            </div>
        </div>
    </section>
</div>

</body>
</html>
