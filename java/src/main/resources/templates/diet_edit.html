<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="fragments/base">
<body>

<head>
    <title>식단 수정 | Guily</title>
    <th:block layout:fragment="css">
        <link rel="stylesheet" th:href="@{/css/diet_edit.css}">
    </th:block>
</head>

<div layout:fragment="content">
    <main class="edit-container">

        <!-- 헤더 -->
        <div class="edit-header">
            <button class="btn-back" onclick="history.back()">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M19 12H5M12 19l-7-7 7-7"/>
                </svg>
            </button>
            <h1 class="edit-title" id="editTitle">아침 식단 수정</h1>
        </div>

        <input type="hidden" id="currentMealType" th:value="${mealType}">

        <!-- 음식 검색 -->
        <section class="search-section">
            <h2 class="section-title">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="11" cy="11" r="8"></circle>
                    <path d="m21 21-4.35-4.35"></path>
                </svg>
                음식 검색
            </h2>

            <div class="search-box">
                <input type="text" class="search-input" placeholder="음식 이름을 입력하세요..." id="foodSearchInput">
                <button class="btn-search" id="btnSearch">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="11" cy="11" r="8"></circle>
                        <path d="m21 21-4.35-4.35"></path>
                    </svg>
                </button>
            </div>

            <!-- 검색 결과 (기본 숨김) -->
            <div class="search-results" id="searchResults" style="display: none;">
                <div class="search-results-header">
                    <span class="search-results-count">검색 결과 <strong id="searchResultCount">0</strong>개</span>
                    <button class="btn-clear-search" id="btnClearSearch">
                        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M18 6 6 18M6 6l12 12"/>
                        </svg>
                        검색 취소
                    </button>
                </div>
                <ul class="search-result-list" id="searchResultList">
                    <!-- JS로 채워짐 -->
                </ul>
            </div>
        </section>

        <!-- 현재 식단 -->
        <section class="current-meal-section">
            <h2 class="section-title">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M3 9h18v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V9Z"></path>
                    <path d="m3 9 2.45-4.9A2 2 0 0 1 7.24 3h9.52a2 2 0 0 1 1.8 1.1L21 9"></path>
                    <path d="M12 3v6"></path>
                </svg>
                현재 식단
            </h2>

            <ul class="meal-list" id="currentMealList">
                <li class="meal-item" data-log-no="1">
                    <div class="meal-info">
                        <span class="food-name">호박죽</span>
                        <span class="food-kcal">196 kcal</span>
                    </div>
                    <button class="btn-remove" data-log-no="1">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M18 6 6 18M6 6l12 12"/>
                        </svg>
                    </button>
                </li>
                <li class="meal-item" data-log-no="2">
                    <div class="meal-info">
                        <span class="food-name">바나나</span>
                        <span class="food-kcal">105 kcal</span>
                    </div>
                    <button class="btn-remove" data-log-no="2">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M18 6 6 18M6 6l12 12"/>
                        </svg>
                    </button>
                </li>
            </ul>

            <div class="empty-meal" id="emptyMeal" style="display: none;">
                <p>식사 기록이 없습니다</p>
            </div>
        </section>

        <!-- 추천 식단 -->
        <section class="recommend-section">
            <div class="recommend-header">
                <h2 class="section-title">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon>
                    </svg>
                    추천 식단
                </h2>
                <button class="btn-refresh-recommend" id="btnRefreshRecommend">
                    <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"></path>
                        <path d="M21 3v5h-5"></path>
                        <path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"></path>
                        <path d="M8 16H3v5"></path>
                    </svg>
                </button>
            </div>

            <ul class="recommend-list" id="recommendList">
                <li class="recommend-item">
                    <div class="recommend-info">
                        <span class="food-name">그릭 요거트</span>
                        <span class="food-kcal">120 kcal</span>
                    </div>
                    <button class="btn-add-recommend" data-food-no="101">
                        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M12 5v14M5 12h14"/>
                        </svg>
                    </button>
                </li>
                <li class="recommend-item">
                    <div class="recommend-info">
                        <span class="food-name">바나나</span>
                        <span class="food-kcal">105 kcal</span>
                    </div>
                    <button class="btn-add-recommend" data-food-no="102">
                        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M12 5v14M5 12h14"/>
                        </svg>
                    </button>
                </li>
                <li class="recommend-item">
                    <div class="recommend-info">
                        <span class="food-name">삶은 계란</span>
                        <span class="food-kcal">78 kcal</span>
                    </div>
                    <button class="btn-add-recommend" data-food-no="103">
                        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M12 5v14M5 12h14"/>
                        </svg>
                    </button>
                </li>
            </ul>
        </section>

        <!-- 영양 분석 -->
        <section class="nutrition-analysis">
            <h2 class="section-title">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <line x1="12" y1="20" x2="12" y2="10"></line>
                    <line x1="18" y1="20" x2="18" y2="4"></line>
                    <line x1="6" y1="20" x2="6" y2="16"></line>
                </svg>
                영양 분석
            </h2>

            <div class="nutrition-cards">
                <div class="nutrition-card total">
                    <span class="card-label">총 칼로리</span>
                    <strong class="card-value" id="totalCalories">301 kcal</strong>
                </div>

                <div class="nutrition-card carbs">
                    <span class="card-label">탄수화물</span>
                    <strong class="card-value" id="totalCarbs">67 g</strong>
                </div>

                <div class="nutrition-card protein">
                    <span class="card-label">단백질</span>
                    <strong class="card-value" id="totalProtein">6 g</strong>
                </div>

                <div class="nutrition-card fat">
                    <span class="card-label">지방</span>
                    <strong class="card-value" id="totalFat">1 g</strong>
                </div>
            </div>

            <!-- 차트 -->
            <div class="chart-container">
                <canvas id="nutritionChart"></canvas>
            </div>

            <div class="chart-legend">
                <div class="legend-item">
                    <span class="legend-dot carbs"></span>
                    <span class="legend-label">탄수화물</span>
                </div>
                <div class="legend-item">
                    <span class="legend-dot protein"></span>
                    <span class="legend-label">단백질</span>
                </div>
                <div class="legend-item">
                    <span class="legend-dot fat"></span>
                    <span class="legend-label">지방</span>
                </div>
            </div>
        </section>

        <!-- 하단 버튼 -->
        <div class="edit-actions">
            <button class="btn-cancel" onclick="history.back()">취소</button>
            <button class="btn-complete" id="btnComplete">완료</button>
        </div>

    </main>
</div>

<th:block layout:fragment="script">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <script th:src="@{/js/diet_edit.js}"></script>
</th:block>

</body>
</html>
