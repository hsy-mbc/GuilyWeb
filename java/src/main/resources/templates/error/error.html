<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Guily - 오류 발생</title>
    <style>
        :root { --primary-color: #009b63; --bg-color: #f8fafc; }
        body { font-family: 'Pretendard', sans-serif; background: var(--bg-color); color: #334155; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .error-card { background: white; padding: 50px; border-radius: 24px; box-shadow: 0 20px 50px rgba(0,0,0,0.05); text-align: center; max-width: 500px; width: 90%; }

        /* 에러 코드 스타일 */
        .error-code { font-size: 80px; font-weight: 900; color: var(--primary-color); margin: 0; line-height: 1; opacity: 0.2; }

        /* 메시지 스타일 */
        h2 { font-size: 24px; margin: 20px 0 10px; color: #1e293b; }
        p { font-size: 16px; color: #64748b; line-height: 1.6; margin-bottom: 30px; }

        /* 버튼 그룹 */
        .btn-group { display: flex; gap: 10px; justify-content: center; }
        .btn { padding: 12px 24px; border-radius: 12px; font-weight: 600; text-decoration: none; transition: all 0.2s; font-size: 15px; }
        .btn-primary { background: var(--primary-color); color: white; }
        .btn-primary:hover { background: #008452; transform: translateY(-2px); }
        .btn-outline { border: 1px solid #e2e8f0; color: #64748b; }
        .btn-outline:hover { background: #f1f5f9; }

        /* 디버그 정보 (개발 환경에서만 보이게 처리 가능) */
        .debug-info { margin-top: 30px; padding: 15px; background: #fff1f2; border-radius: 8px; font-size: 12px; color: #e11d48; text-align: left; display: none; }
    </style>
</head>
<body>
<div class="error-card">
    <p class="error-code" th:text="${status}">500</p>

    <div th:switch="${status}">
        <div th:case="404">
            <h2>페이지를 찾을 수 없습니다</h2>
            <p>요청하신 페이지가 삭제되었거나<br>주소가 잘못 입력되었습니다.</p>
        </div>

        <div th:case="403">
            <h2>접근 권한이 없습니다</h2>
            <p>이 페이지에 접근할 수 있는 권한이 없거나<br>로그인이 필요한 서비스입니다.</p>
        </div>

        <div th:case="*">
            <h2>서비스에 오류가 발생했습니다</h2>
            <p>잠시 후 다시 시도해 주세요.<br>문제가 지속되면 관리자에게 문의 바랍니다.</p>
        </div>
    </div>

    <div class="btn-group">
        <a href="javascript:history.back()" class="btn btn-outline">이전 페이지</a>
        <a href="/" class="btn btn-primary">홈으로 이동</a>
    </div>

    <div class="debug-info" th:if="${message != null}"
         th:style="${#strings.contains(#environment.getActiveProfiles()[0], 'dev')} ? 'display:block' : 'display:none'">
        <strong>Debug Message:</strong> <span th:text="${message}">Error detail</span>
    </div>
</div>
</body>
</html>
