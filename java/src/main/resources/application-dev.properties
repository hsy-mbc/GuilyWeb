spring.application.name=GuilyWeb
# 톰캣 포트 설정
server.port = 8080
# logging level 설정 debug,warn,error ...
logging.level.root = info
# Security logging level 설정
logging.level.org.springframework.security=DEBUG
# 더 자세한 에러 정보
server.error.include-message=always
server.error.include-binding-errors=always

# MySQL DB 설정
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/guilyweb?\
  serverTimezone=Asia/Seoul&useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=UTF-8
spring.datasource.username=guily
spring.datasource.password=vhktn0402!!

# JPA/Hibernate 설정
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect