<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/springsecurity6"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="fragments/base">
<body>

<head>
    <th:block layout:fragment="css">
        <link rel="stylesheet" th:href="@{/css/board.css}">
    </th:block>
</head>

<div layout:fragment="content">
    <main class="board-container">

        <!-- 헤더 영역 -->
        <section class="board-header">
            <div class="board-title">
                <h1>커뮤니티</h1>
                <p>건강한 일상을 함께 공유하세요.</p>
            </div>

            <!-- 글쓰기 버튼 -->
            <a th:href="@{/board/write}" class="btn-write" sec:authorize="isAuthenticated()">
                <span class="plus">+</span> 글쓰기
            </a>
            <a th:href="@{/login}" class="btn-write" sec:authorize="isAnonymous()">
                <span class="plus">+</span> 글쓰기
            </a>
        </section>

        <!-- 검색 구역 (아이콘 추가) -->
        <div class="board-search">
            <div class="search-inner">
                <svg class="search-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#b0b6bd" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="11" cy="11" r="8"></circle>
                    <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                </svg>
                <input type="text" placeholder="게시글 검색..." class="board-search-input" />
            </div>
        </div>

        <!-- 카테고리 -->
        <div class="board-category">
            <button class="category active" data-category="ALL">전체</button>
            <button class="category" data-category="SUCCESS">성공후기</button>
            <button class="category" data-category="RECIPE">레시피</button>
            <button class="category" data-category="QUESTION">질문</button>
            <button class="category" data-category="INFO">정보</button>
            <button class="category" data-category="FREE">자유</button>
        </div>

        <section class="board-list" id="post-list">

            <article class="board-item" th:each="post : ${posts}">
                <div class="board-item-header">
                    <div class="profile">
                        <span class="avatar"></span>
                        <div>
                            <span class="nickname" th:text="${post.authorName}">닉네임</span>
                            <span class="time" th:text="${post.timeAgo}">방금 전</span>
                        </div>
                    </div>

                    <span th:class="'badge ' + ${post.categoryCode != null ? post.categoryCode.toLowerCase() : ''}"
                          th:text="${post.categoryName}">카테고리</span>
                </div>

                <h3 class="board-item-title">
                    <a th:href="@{/board/{id}(id=${post.postNo})}" th:text="${post.title}">제목</a>
                </h3>

                <p class="board-item-content" th:text="${post.content}">
                    게시글 본문 요약 내용이 출력됩니다.
                </p>

                <div class="board-item-footer">
                    <span class="stat-item">
                        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon-heart">
                            <path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/>
                        </svg>
                        <span th:text="${post.likeCount}">0</span>
                    </span>

                    <span class="stat-item">
                        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon-comment">
                            <path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z"/>
                        </svg>
                        <span th:text="${post.commentCount}">0</span>
                    </span>
                </div>
            </article>

            <div th:if="${#lists.isEmpty(posts)}" style="text-align: center; padding: 50px; color: #777;">
                게시글이 존재하지 않습니다.
            </div>

        </section>

        <!-- 더보기 -->
        <div class="board-more">
            <button class="btn btn-outline">더 보기</button>
        </div>

    </main>
</div>

<th:block layout:fragment="script">
    <script th:src="@{/js/board.js}"></script>
</th:block>

</body>
</html>
