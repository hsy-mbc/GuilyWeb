<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Signup | Guily</title>

    <meta name="_csrf" th:content="${_csrf != null ? _csrf.token : ''}"/>
    <meta name="_csrf_header" th:content="${_csrf != null ? _csrf.headerName : ''}"/>

    <link rel="stylesheet" th:href="@{/css/auth.css}" />
</head>

<body>

<div class="auth-wrapper">
    <div class="auth-card signup-card">

        <!-- header -->
        <header class="auth-header">
            <h1 class="auth-title"><a th:href="@{/}">Guily</a></h1>
            <p class="auth-subtitle">새로운 건강 관리의 시작</p>
        </header>

        <!-- body -->
        <main class="auth-body">
            <form class="auth-form" th:action="@{/signup}" method="post" id="signupForm">

                <!-- ID 중복체크 포함 -->
                <div class="form-group">
                    <label class="form-label">아이디 <span class="required">*</span></label>
                    <div class="form-inline">
                        <input type="text" name="userId" id="userId" class="form-input" placeholder="아이디를 입력하세요" required />
                        <button type="button" id="btn-check-id" class="btn btn-outline-sm">중복확인</button>
                    </div>
                    <small id="id-msg" class="form-msg"></small>
                </div>

                <!-- Password -->
                <div class="form-group">
                    <label class="form-label">비밀번호 <span class="required">*</span></label>
                    <input type="password" name="password" id="password" class="form-input" placeholder="영문, 숫자 포함 8자 이상" required />
                </div>

                <!-- Password Check -->
                <div class="form-group">
                    <label class="form-label">비밀번호 확인 <span class="required">*</span></label>
                    <input type="password" name="passwordConfirm" id="passwordConfirm" class="form-input" placeholder="비밀번호를 한 번 더 입력하세요" required />
                    <small id="pw-msg" class="form-msg"></small>
                </div>

                <hr class="form-divider" />

                <!-- 개인 정보 섹션 -->
                <div class="form-group">
                    <label class="form-label">이름 <span class="required">*</span></label>
                    <input type="text" name="name" class="form-input" placeholder="실명을 입력하세요" required />
                </div>

                <div class="form-group">
                    <label class="form-label">성별 <span class="required">*</span></label>
                    <div class="form-radio-group">
                        <label class="radio-label"><input type="radio" name="gender" value="MALE" required /> 남성</label>
                        <label class="radio-label"><input type="radio" name="gender" value="FEMALE" required /> 여성</label>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label">생년월일 <span class="required">*</span></label>
                    <input type="date" name="birthdate" class="form-input" required />
                </div>

                <!-- 신체 정보 (선택) -->
                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label">키 (cm)</label>
                        <input type="number" name="height" class="form-input" placeholder="예: 175" />
                    </div>
                    <div class="form-group">
                        <label class="form-label">몸무게 (kg)</label>
                        <input type="number" name="weight" class="form-input" placeholder="예: 70" />
                    </div>
                </div>

                <div class="form-actions mt-30">
                    <button type="button" class="btn btn-ghost" onclick="location.href='/login'">취소</button>
                    <button type="submit" class="btn btn-primary">가입하기</button>
                </div>
            </form>
        </main>

        <!-- footer -->
        <footer class="auth-footer">
            © 2026 Guily. All rights reserved.
        </footer>

    </div>
</div>

</body>

<script th:src="@{/js/common.js}"></script>
<script th:src="@{/js/signup.js}"></script>

</html>
