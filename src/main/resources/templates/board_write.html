<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="fragments/base">
<body>

<head>
    <th:block layout:fragment="css">
        <link rel="stylesheet" th:href="@{/css/board.css}">
        <link rel="stylesheet" th:href="@{/css/board_write.css}">
    </th:block>
</head>

<div layout:fragment="content">
    <main class="board-write">

        <!-- 상단 -->
        <div class="write-header">
            <a th:href="@{/board}" class="back-link">← 돌아가기</a>
            <h1>글쓰기</h1>
            <p>커뮤니티에 새로운 글을 작성해보세요</p>
        </div>

        <!-- 작성 카드 -->
        <section class="write-card">
            <form id="writeForm" th:action="@{/api/post}" method="post">
                <input type="hidden" name="category" id="selectedCategory" value="SUCCESS">

                <!-- 카테고리 -->
                <div class="write-group">
                    <label class="write-label">카테고리</label>
                    <div class="write-category">
                        <button type="button" class="category active" data-value="SUCCESS">성공후기</button>
                        <button type="button" class="category" data-value="RECIPE">레시피</button>
                        <button type="button" class="category" data-value="QUESTION">질문</button>
                        <button type="button" class="category" data-value="INFO">정보</button>
                        <button type="button" class="category" data-value="FREE">자유</button>
                    </div>
                </div>

                <div class="write-group">
                    <label class="write-label">제목</label>
                    <input type="text" name="title" class="form-input" placeholder="제목을 입력하세요" required />
                </div>

                <div class="write-group">
                    <label class="write-label">내용</label>
                    <textarea name="content" class="form-textarea" placeholder="내용을 입력하세요" required></textarea>
                </div>

                <div class="write-guide">
                    <strong>💡 작성 팁</strong>
                    <ul>
                        <li>다른 사용자에게 도움이 되는 정보를 공유해주세요</li>
                        <li>존중하는 언어를 사용해주세요</li>
                        <li>개인정보는 공유하지 마세요</li>
                    </ul>
                </div>

                <!-- 버튼 -->
                <div class="write-actions">
                    <a th:href="@{/board}" class="btn-cancel">취소</a>
                    <button type="submit" id="submitBtn" class="btn-submit" disabled>작성 완료</button>
                </div>
            </form>
        </section>

    </main>
</div>

<th:block layout:fragment="script">
    <script th:src="@{/js/board_write.js}"></script>
</th:block>

</body>
</html>
