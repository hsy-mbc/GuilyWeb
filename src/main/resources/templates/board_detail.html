<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/springsecurity6"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="fragments/base">
<body>

<head>
    <title th:text="${post.title}">게시글 상세</title>
    <th:block layout:fragment="css">
        <link rel="stylesheet" th:href="@{/css/board_detail.css}">
    </th:block>
</head>

<div layout:fragment="content" class="board-detail">
    <!-- 상단 뒤로가기 -->
    <div class="detail-header">
        <a th:href="@{/board}" class="back-link">← 목록으로</a>
    </div>

    <!-- 게시글 카드 -->
    <section class="post-card" th:object="${post}">
        <span th:class="'badge ' + *{categoryCode != null ? categoryCode.toLowerCase() : ''}"
              th:text="*{categoryName}">카테고리</span>

        <h1 class="post-title" th:text="*{title}">게시글 제목입니다.</h1>

        <div class="post-meta">
            <div class="author">
                <div class="avatar"></div>
                <div>
                    <strong th:text="*{authorName}">작성자 닉네임</strong>
                    <span th:text="*{timeAgo}">2시간 전</span>
                </div>
            </div>

            <div class="post-stats">
                <span class="stat-item">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/></svg>
                    <span th:text="*{likeCount}">0</span>
                </span>
                <span class="stat-item">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z"/></svg>
                    <span th:text="*{commentCount}">0</span>
                </span>
                <span class="stat-item">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
                    <span th:text="*{viewCount}">0</span>
                </span>
            </div>
        </div>

        <!-- 2. 게시글 본문 -->
        <div class="post-content">
            <p th:text="*{content}">게시글 본문 내용입니다.</p>
        </div>

        <div class="like-area">
            <button class="like-btn" id="btn-like" th:data-post-no="*{postNo}">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon-heart">
                    <path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/>
                </svg>
                좋아요
            </button>
            <span class="like-count" th:text="*{likeCount}">0</span>
        </div>
    </section>

    <!-- 댓글 영역 -->
    <section class="comment-section">
        <h2>댓글 <span class="count" th:text="${post.commentCount}">0</span></h2>

        <!-- 로그인한 경우: 작성 칸 노출 -->
        <div class="comment-write" sec:authorize="isAuthenticated()">
            <div class="avatar"></div>
            <textarea id="comment-input" placeholder="댓글을 입력하세요..."></textarea>
            <button type="button" class="comment-submit" id="btn-comment-submit">작성</button>
        </div>

        <!-- 로그인하지 않은 경우: 안내 메시지 노출 -->
        <div class="comment-write-placeholder" sec:authorize="isAnonymous()">
            <a th:href="@{/login}">로그인</a> 후 댓글을 남겨보세요.
        </div>

        <!-- 댓글 리스트 -->
        <ul class="comment-list" id="comment-list">
            <li class="comment" th:each="comment : ${post.comments}">
                <div class="avatar gray"></div>
                <div class="comment-body">
                    <div class="comment-header">
                        <strong th:text="${comment.authorName}">닉네임</strong>
                        <span th:text="${comment.timeAgo}">1시간 전</span>
                    </div>
                    <p th:text="${comment.content}">댓글 내용</p>
                    <span class="comment-like">
                        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/></svg>
                        0
                    </span>
                </div>
            </li>
        </ul>

        <div th:if="${#lists.isEmpty(post.comments)}"
             id="comment-empty-msg"
             style="text-align: center; color: #999; padding: 40px 0; font-size: 15px;">
            <p>아직 댓글이 없습니다.<br>첫 번째 댓글을 남겨보세요! 💬</p>
        </div>
    </section>
</div>

<th:block layout:fragment="script">
    <script th:src="@{/js/board_detail.js}"></script>
</th:block>

</body>
</html>
