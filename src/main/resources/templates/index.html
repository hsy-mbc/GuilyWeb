<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="fragments/base">

<body>

<div layout:fragment="content">
    <section class="hero">
        <div class="hero-inner">
            <h1>
                건강한 일상을 위한
                <span>스마트한 관리</span>
            </h1>
            <p>Guily와 함께 식단과 운동을 체계적으로 관리하세요.</p>

            <div class="hero-buttons">
                <button class="btn primary">시작하기</button>
                <button class="btn outline">더 알아보기</button>
            </div>
        </div>
    </section>

    <section class="features">
        <div class="features-inner">
            <div class="card">식단 관리</div>
            <div class="card">운동 관리</div>
            <div class="card">진행 상황 추적</div>
            <div class="card">커뮤니티</div>
        </div>
    </section>
</div>

</body>
</html>
