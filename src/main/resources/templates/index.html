<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8" />
    <title>Guily</title>
    <link rel="stylesheet" href="css/main.css" />
</head>
<body>

<header class="header">
    <div class="header-inner">
        <div class="logo">Guily</div>

        <nav class="nav">
            <a href="#">식단</a>
            <a href="#">운동</a>
            <a href="#">게시판</a>
        </nav>

        <button class="login-btn">로그인</button>
    </div>
</header>

<section class="hero">
    <div class="hero-inner">
        <h1>
            건강한 일상을 위한
            <span>스마트한 관리</span>
        </h1>
        <p>
            Guily와 함께 식단과 운동을 체계적으로 관리하세요.
        </p>

        <div class="hero-buttons">
            <button class="btn primary">시작하기 →</button>
            <button class="btn outline">더 알아보기</button>
        </div>
    </div>
</section>

<section class="features">
    <div class="features-inner">
        <div class="card">식단 관리</div>
        <div class="card">운동 관리</div>
        <div class="card">진행 상황 추적</div>
        <div class="card">커뮤니티</div>
    </div>
</section>

</body>
</html>
