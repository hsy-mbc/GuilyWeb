<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="fragments/base">
<body>

<head>
    <title>게시글 수정</title>
    <th:block layout:fragment="css">
        <link rel="stylesheet" th:href="@{/css/board_edit.css}">
    </th:block>
</head>

<div layout:fragment="content" class="board-write">
    <div class="detail-header">
        <a th:href="@{/board/{no}(no=${post.postNo})}" class="back-link">← 돌아가기</a>
    </div>

    <div class="container">
        <h2>게시글 수정</h2>

        <form id="editForm">
            <input type="hidden" id="postNo" th:value="${post.postNo}">
            <input type="hidden" id="selectedCategory" th:value="${post.categoryCode}">

            <div class="form-group">
                <label class="write-label">카테고리</label>
                <div class="write-category">
                    <button type="button" class="category" data-value="SUCCESS"
                            th:classappend="${post.categoryCode == 'SUCCESS' ? 'active' : ''}">성공후기</button>
                    <button type="button" class="category" data-value="RECIPE"
                            th:classappend="${post.categoryCode == 'RECIPE' ? 'active' : ''}">레시피</button>
                    <button type="button" class="category" data-value="QUESTION"
                            th:classappend="${post.categoryCode == 'QUESTION' ? 'active' : ''}">질문</button>
                    <button type="button" class="category" data-value="INFO"
                            th:classappend="${post.categoryCode == 'INFO' ? 'active' : ''}">정보</button>
                    <button type="button" class="category" data-value="FREE"
                            th:classappend="${post.categoryCode == 'FREE' ? 'active' : ''}">자유</button>
                </div>
            </div>

            <div class="form-group">
                <label class="write-label">제목</label>
                <input type="text" name="title" class="write-input" th:value="${post.title}"
                       placeholder="제목을 입력하세요" required>
            </div>

            <div class="form-group">
                <label class="write-label">내용</label>
                <textarea name="content" class="write-textarea" rows="15"
                          placeholder="내용을 입력하세요" required th:text="${post.content}"></textarea>
            </div>

            <div class="form-actions">
                <button type="button" class="btn-cancel" onclick="history.back()">취소</button>
                <button type="submit" class="btn-submit">수정 완료</button>
            </div>
        </form>
    </div>

</div>

<th:block layout:fragment="script">
    <script th:src="@{/js/board_edit.js}"></script>
</th:block>

</body>
</html>
