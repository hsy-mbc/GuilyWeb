<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Guily</title>

    <meta name="_csrf" th:content="${_csrf != null ? _csrf.token : ''}"/>
    <meta name="_csrf_header" th:content="${_csrf != null ? _csrf.headerName : ''}"/>

    <link rel="stylesheet" th:href="@{/css/auth.css}" />
</head>

<body>

<div class="auth-wrapper">
    <div class="auth-card">

        <header class="auth-header">
            <h1 class="auth-title"><a th:href="@{/}">Guily</a></h1>
            <p class="auth-subtitle">건강한 일상의 시작</p>
        </header>

        <main class="auth-body">

            <!-- 가입 성공 메시지 출력 -->
            <div th:if="${message}" class="alert alert-info" th:text="${message}"></div>
            <!-- 알림 메시지 (실패/로그아웃) -->
            <div th:if="${param.error}" class="alert alert-danger">
                ⚠️ 아이디 또는 비밀번호가 일치하지 않습니다.
            </div>
            <div th:if="${param.logout}" class="alert alert-info">
                성공적으로 로그아웃 되었습니다.
            </div>

            <form class="auth-form" th:action="@{/login}" method="post">

                <!-- 아이디 입력 -->
                <div class="form-group">
                    <label class="form-label">아이디</label>
                    <input type="text" name="userId" class="form-input" placeholder="ID 입력" required autofocus />
                </div>

                <!-- 비밀번호 입력 -->
                <div class="form-group">
                    <label class="form-label">비밀번호</label>
                    <input type="password" name="password" class="form-input" placeholder="Password" required />
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn btn-primary">Login</button>
                    <a th:href="@{/signup}" class="btn btn-outline">Signup</a>
                </div>

            </form>
        </main>

        <!-- footer -->
        <footer class="auth-footer">
            <p>© 2026 Guily. All rights reserved.</p>
        </footer>

    </div>
</div>

</body>
</html>
